<!DOCTYPE html>
<html>

<head>
    <title>Reset Password - Diverse Delights</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center min-h-screen bg-[#540b0e] py-12 px-4">

    <div class="bg-[#fff3b0] p-8 rounded-lg shadow-lg max-w-sm w-full">

        <h2 class="text-4xl font-bold text-[#335c67] mb-6 text-center">
            Reset Password
        </h2>

        <!-- STEP 1: Email -->
        {% if step == "email" %}
        <form method="POST" action="/auth/send-otp">
            <input type="email" name="email" required placeholder="Email"
                class="w-full p-2 rounded border border-[#335c67] mb-4">

            <button class="w-full bg-[#335c67] text-white p-2 rounded">
                Send OTP
            </button>
        </form>
        {% endif %}

        <!-- STEP 2: OTP -->
        {% if step == "otp" %}
        <form method="POST" action="/auth/verify-otp" class="mt-4">
            <input type="text" name="otp" required maxlength="6" placeholder="Enter OTP"
                class="w-full p-2 rounded border border-[#335c67] mb-4">

            <button class="w-full bg-[#9e2a2b] text-white p-2 rounded">
                Verify OTP
            </button>
        </form>
        {% endif %}

        <!-- STEP 3: New Password -->
        {% if step == "reset" %}
        <form method="POST" action="/auth/reset-password" class="mt-6">

            <div class="relative mb-4">
                <input id="password" type="password" name="password" required placeholder="New Password"
                    class="w-full p-2 rounded border border-[#335c67]">

                <button type="button" onclick="togglePassword('password', this)"
                    class="absolute right-2 top-1/2 -translate-y-1/2 text-xl">
                    🙈
                </button>
            </div>

            <div class="relative mb-4">
                <input id="confirmPassword" type="password" name="confirmPassword" required
                    placeholder="Confirm Password" class="w-full p-2 rounded border border-[#335c67]">

                <button type="button" onclick="togglePassword('confirmPassword', this)"
                    class="absolute right-2 top-1/2 -translate-y-1/2 text-xl">
                    🙈
                </button>
            </div>

            <button class="w-full bg-[#335c67] text-white p-2 rounded">
                Reset Password
            </button>
        </form>
        {% endif %}

        <p class="mt-6 text-sm text-center">
            Remembered password?
            <a href="/auth/login" class="underline text-[#e09f3e]">
                Login
            </a>
        </p>

    </div>

    <script>
        function togglePassword(id, btn) {
            const field = document.getElementById(id);

            if (field.type === "password") {
                field.type = "text";
                btn.textContent = "🐵";
            } else {
                field.type = "password";
                btn.textContent = "🙈";
            }
        }
    </script>
    {% include "components/alerts.html" %}

</body>

</html>
