<!DOCTYPE html>
<html>

<head>
    <title>Register - Diverse Delights</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center min-h-screen bg-[#540b0e] bg-opacity-90 py-12 px-4">

    <form method="POST" class="bg-[#fff3b0] p-8 rounded-lg shadow-lg max-w-sm w-full">

        <h2 class="text-4xl font-bold text-[#335c67] mb-6 text-center">
            Register
        </h2>

        <hr class="my-6 border-gray-300">

        <input name="email" type="email" placeholder="Email" class="w-full p-2 mb-4 rounded border border-[#335c67]"
            required>

        <input name="contactNumber" placeholder="Contact Number" class="w-full p-2 mb-4 rounded border border-[#335c67]"
            required>

        <input name="firstName" placeholder="First Name" class="w-full p-2 mb-4 rounded border border-[#335c67]"
            required>

        <input name="lastName" placeholder="Last Name" class="w-full p-2 mb-4 rounded border border-[#335c67]" required>

        <!-- Password -->
        <div class="relative mb-4">
            <input id="password" name="password" type="password" placeholder="Password"
                class="w-full p-2 rounded border border-[#335c67]" required>

            <button type="button" onclick="togglePassword('password', this)"
                class="absolute right-2 top-1/2 -translate-y-1/2">
                🙈
            </button>
        </div>

        <!-- Confirm -->
        <div class="relative mb-4">
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm Password"
                class="w-full p-2 rounded border border-[#335c67]" required>

            <button type="button" onclick="togglePassword('confirmPassword', this)"
                class="absolute right-2 top-1/2 -translate-y-1/2">
                🙈
            </button>
        </div>

        <button type="submit" class="mt-6 w-full bg-[#335c67] text-white p-2 rounded-lg hover:bg-[#540b0e]">
            Register
        </button>

        <p class="mt-6 text-sm text-center">
            Already have an account?
            <a href="/auth/login" class="text-[#e09f3e] underline">
                Login
            </a>
        </p>

    </form>

    <script>
        function togglePassword(id, btn) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
                btn.innerText = "🐵";
            } else {
                input.type = "password";
                btn.innerText = "🙈";
            }
        }
    </script>
    {% include "components/alerts.html" %}

</body>

</html>
